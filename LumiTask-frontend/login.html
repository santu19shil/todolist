<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome | LumiTask</title>

    <link rel="stylesheet" href="css/login.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>

    <div class="background"></div>

    <div class="lamp-area">
        <img src="assets/lamp-off.png" id="lamp" class="lamp" draggable="false" alt="Lamp">
        <div class="light-cone"></div>
    </div>

    <div id="lampMessage" class="lamp-message">
        <h2>Welcome</h2>
        <p>Plan your day with a clear mind.</p>
    </div>

    <div id="toast" class="toast"></div>

    <div id="authBox" class="login-card">
        <h1>Welcome</h1>
        <p class="subtitle">Sign in to continue</p>

        <div class="form-switch">
            <button id="loginTab" class="active">Login</button>
            <button id="registerTab">Register</button>
        </div>

        <form id="loginForm">
            <div class="input-box">
                <input type="email" id="loginEmail" placeholder="Email Address" autocomplete="email" required>
                <span class="error" id="loginEmailError"></span>
            </div>

            <div class="input-box password-box">
                <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password" required>
                <i class="fa-solid fa-eye toggle-password" data-target="loginPassword"></i>
                <span class="error" id="loginPasswordError"></span>
            </div>

            <div class="remember-row">
                <label>
                    <input type="checkbox" id="rememberMe">
                    <span>Remember Me</span>
                </label>

                <a href="forgot-password.html" class="forgot-link">Forgot Password?</a>
            </div>

            <button type="submit" id="loginBtn">Login</button>
        </form>

        <form id="registerForm" style="display:none;">
            <div class="input-box">
                <input type="text" id="fullName" placeholder="Full Name" required>
                <span class="error" id="nameError"></span>
            </div>

            <div class="input-box">
                <input type="email" id="registerEmail" placeholder="Email Address" required>
                <span class="error" id="registerEmailError"></span>
            </div>

            <div class="input-box password-box">
                <input type="password" id="registerPassword" placeholder="Password" required>
                <i class="fa-solid fa-eye toggle-password" data-target="registerPassword"></i>
                <span class="error" id="registerPasswordError"></span>
            </div>

            <div class="input-box password-box">
                <input type="password" id="confirmPassword" placeholder="Confirm Password" required>
                <i class="fa-solid fa-eye toggle-password" data-target="confirmPassword"></i>
                <span class="error" id="confirmPasswordError"></span>
            </div>

            <small class="verify-text">A verification email will be sent after registration.</small>

            <button type="submit" id="registerBtn">Create Account</button>
        </form>
    </div>

    <script src="js/login.js"></script>

</body>

</html>
