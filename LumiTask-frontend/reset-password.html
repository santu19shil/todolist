<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | LumiTask</title>

    <link rel="stylesheet" href="css/login.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>
    <div class="background"></div>

    <div class="login-card show">
        <h1>Set a New Password</h1>
        <p class="subtitle">Choose a secure password for your LumiTask account.</p>

        <form id="resetPasswordForm">
            <input type="hidden" id="resetToken">

            <div class="input-box password-box">
                <input type="password" id="resetPassword" placeholder="New Password" required>
                <i class="fa-solid fa-eye toggle-password" data-target="resetPassword"></i>
            </div>

            <div class="input-box password-box">
                <input type="password" id="confirmResetPassword" placeholder="Confirm New Password" required>
                <i class="fa-solid fa-eye toggle-password" data-target="confirmResetPassword"></i>
            </div>

            <button type="submit" id="resetBtn">Update Password</button>
        </form>

        <p id="resetMessage" class="verify-text" style="margin-top:16px;"></p>

        <p class="verify-text" style="margin-top:8px;">
            <a href="login.html">Return to login</a>
        </p>
    </div>

    <script src="js/auth-pages.js"></script>
</body>

</html>
