<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | LumiTask</title>

    <link rel="stylesheet" href="css/login.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>
    <div class="background"></div>

    <div class="login-card show">
        <h1>Forgot Password</h1>
        <p class="subtitle">Enter your email to receive a reset link.</p>

        <form id="forgotPasswordForm">
            <div class="input-box">
                <input type="email" id="forgotEmail" placeholder="Email Address" autocomplete="email" required>
            </div>

            <button type="submit" id="forgotBtn">Send Reset Link</button>
        </form>

        <p id="forgotMessage" class="verify-text" style="margin-top:16px;"></p>

        <p class="verify-text" style="margin-top:8px;">
            <a href="login.html">Back to login</a>
        </p>
    </div>

    <script src="js/auth-pages.js"></script>
</body>

</html>
